      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.48" stop-color="#315bea"/>
      <stop offset="1" stop-color="#172b9c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0.7"/>
